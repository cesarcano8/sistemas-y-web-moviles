<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Productos | Salsamentariaa</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous">
    <link rel="stylesheet" href="/static/styles.css?v=5">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="/">Salsamentaria</a>
        <span class="navbar-text">Catálogo de productos</span>
      </div>
    </nav>

    <main class="container py-4 py-lg-5">
      <div class="mb-4">
        <h1 class="h3 mb-1">Productos</h1>
        <p class="text-secondary mb-0">Inventario local de la salsamentaria.</p>
      </div>

      <div id="mensaje" class="alert d-none" role="alert"></div>

      <div class="d-flex justify-content-end mb-3">
        <button id="abrir-formulario" type="button" class="btn btn-primary">
          Agregar producto
        </button>
      </div>

      <dialog id="dialogo-producto" class="dialogo-producto" aria-labelledby="titulo-formulario">
        <section class="card border-0 shadow-sm">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h2 class="h5 mb-0" id="titulo-formulario">Agregar producto</h2>
              <button id="cerrar-dialogo" type="button" class="btn-close" aria-label="Cerrar"></button>
            </div>
          <form id="formulario-producto">
            <div class="row g-3">
              <div class="col-md-4">
                <label for="nombre" class="form-label">Nombre</label>
                <input id="nombre" name="nombre" class="form-control" maxlength="100" required>
              </div>
              <div class="col-md-4">
                <label for="id_categoria" class="form-label">Categoría</label>
                <select id="id_categoria" name="id_categoria" class="form-select" required>
                  <option value="">Selecciona una categoría</option>
                </select>
              </div>
              <div class="col-md-4">
                <label for="id_proveedor" class="form-label">Proveedor</label>
                <select id="id_proveedor" name="id_proveedor" class="form-select" required>
                  <option value="">Selecciona un proveedor</option>
                </select>
              </div>
              <div class="col-md-3">
                <label for="unidad" class="form-label">Unidad</label>
                <select id="unidad" name="unidad" class="form-select" required>
                  <option value="KG">Kilogramo (KG)</option>
                  <option value="UND">Unidad (UND)</option>
                </select>
              </div>
              <div class="col-md-3">
                <label for="precio_venta" class="form-label">Precio de venta</label>
                <input id="precio_venta" name="precio_venta" type="number" min="0.01" step="0.01" class="form-control" required>
              </div>
              <div class="col-md-3">
                <label for="stock_actual" class="form-label">Stock actual</label>
                <input id="stock_actual" name="stock_actual" type="number" min="0" step="0.001" class="form-control" required>
              </div>
              <div class="col-md-3">
                <label for="stock_minimo" class="form-label">Stock mínimo</label>
                <input id="stock_minimo" name="stock_minimo" type="number" min="0" step="0.001" class="form-control" required>
              </div>
              <div class="col-md-3 d-flex align-items-center">
                <div class="form-check mt-md-4">
                  <input id="activo" name="activo" type="checkbox" class="form-check-input" checked>
                  <label for="activo" class="form-check-label">Producto activo</label>
                </div>
              </div>
              <div class="col-12 d-flex gap-2">
                <button id="guardar-producto" type="submit" class="btn btn-primary">Guardar producto</button>
                <button id="cancelar-edicion" type="button" class="btn btn-outline-secondary d-none">Cancelar edición</button>
              </div>
            </div>
          </form>
          </div>
        </section>
      </dialog>

      <section class="card border-0 shadow-sm">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th scope="col" class="ps-3">ID</th>
                  <th scope="col">Nombre</th>
                  <th scope="col">Categoría</th>
                  <th scope="col">Proveedor</th>
                  <th scope="col">Unidad</th>
                  <th scope="col" class="text-end">Venta</th>
                  <th scope="col" class="text-end">Stock</th>
                  <th scope="col" class="text-end">Mínimo</th>
                  <th scope="col" class="pe-3">Estado</th>
                  <th scope="col" class="pe-3">Acciones</th>
                </tr>
              </thead>
              <tbody id="lista-productos">
                <tr>
                  <td colspan="10" class="text-center text-secondary py-4">Cargando productos...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        <div class="card-footer bg-white text-secondary small" id="total-productos"></div>
      </section>
    </main>

    <script src="/static/app.js?v=5"></script>
  </body>
</html>
